        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Check for model/migration drift
        env:
          APP_ENVIRONMENT: dev
          DEV_DATABASE_URL: postgresql+psycopg://root:root@localhost:5432/wyrmwood_coffee_alembic_check
          JWT_SECRET_KEY: ci-alembic-drift-check-jwt-secret-not-for-production
        run: |
          PGPASSWORD=root createdb -h localhost -U root wyrmwood_coffee_alembic_check
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80


  migrate-staging:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    env:
      APP_ENVIRONMENT: staging
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Apply staging database migrations
        run: uv run alembic upgrade head
