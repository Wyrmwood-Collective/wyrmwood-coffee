name: CI

on:
  push:
    branches: ['sprint/**']
  pull_request:
    branches: ['sprint/**']

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEV_DATABASE_URL: postgresql+psycopg://root:root@localhost:5432/wyrmwood_coffee_test
      APP_ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://root:root@localhost:5432/wyrmwood_coffee_test
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-production

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Check for model/migration drift
        env:
          APP_ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+psycopg://root:root@localhost:5432/wyrmwood_coffee_alembic_check
        run: |
          PGPASSWORD=root createdb -h localhost -U root wyrmwood_coffee_alembic_check
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with oxlint
        working-directory: frontend
        run: npx oxlint .

      - name: Lint with ESLint
        working-directory: frontend
        run: npx eslint .

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npx prettier --check --experimental-cli .

      - name: Type-check with vue-tsc
        working-directory: frontend
        run: npx vue-tsc --build
