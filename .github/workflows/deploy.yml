name: Test Azure Auth

on:
  workflow_dispatch:
  push:
    branches:
      - infra

jobs:
  test-auth:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify auth worked
        run: az webapp show --name wyrmwood-coffee-api --resource-group wyrmwood-coffee-rg
